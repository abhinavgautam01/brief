[tool]
name = "Crystal"
category = "language"
homepage = "https://crystal-lang.org"
docs = "https://crystal-lang.org/reference/"
repo = "https://github.com/crystal-lang/crystal"
description = "Compiled language with Ruby-like syntax"

[detect]
files = ["shard.yml", "*.cr", "**/*.cr"]
ecosystems = ["crystal"]

[taxonomy]
role = ["language"]

[[security.sinks]]
symbol = "system"
threat = "command_injection"
cwe = "CWE-78"
note = "Runs a command through the system shell"

[[security.sinks]]
symbol = "Process.run"
threat = "command_injection"
cwe = "CWE-78"
note = "Dangerous when command or args are caller-controlled"

[[security.sinks]]
symbol = "Process.new"
threat = "command_injection"
cwe = "CWE-78"

[[security.sinks]]
symbol = "`"
threat = "command_injection"
cwe = "CWE-78"
note = "Backtick command execution"

[[security.sinks]]
symbol = "run"
threat = "command_injection"
cwe = "CWE-78"
note = "Macro compile-time command execution"

[[security.sinks]]
symbol = "File.read"
threat = "path_traversal"
cwe = "CWE-22"
note = "When file path is caller-controlled"

[[security.sinks]]
symbol = "YAML.parse"
threat = "deserialization"
cwe = "CWE-502"
note = "Avoid parsing untrusted YAML into application objects"
