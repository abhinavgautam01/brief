[tool]
name = "Julia"
category = "language"
homepage = "https://julialang.org"
docs = "https://docs.julialang.org"
repo = "https://github.com/JuliaLang/julia"
description = "High-performance language for technical computing"

[detect]
files = ["Project.toml", "*.jl", "**/*.jl"]
ecosystems = ["julia"]

[taxonomy]
role = ["language"]

[[security.sinks]]
symbol = "eval"
threat = "code_injection"
cwe = "CWE-94"
note = "Evaluates Julia expressions"

[[security.sinks]]
symbol = "Meta.parse"
threat = "code_injection"
cwe = "CWE-94"
note = "Dangerous when parsed expressions are evaluated"

[[security.sinks]]
symbol = "run"
threat = "command_injection"
cwe = "CWE-78"
note = "Executes external commands"

[[security.sinks]]
symbol = "Cmd"
threat = "command_injection"
cwe = "CWE-78"
note = "Shell command construction with caller-controlled values"

[[security.sinks]]
symbol = "include"
threat = "code_injection"
cwe = "CWE-94"
note = "Executes source from caller-controlled paths"

[[security.sinks]]
symbol = "Serialization.deserialize"
threat = "deserialization"
cwe = "CWE-502"

[[security.sinks]]
symbol = "open"
threat = "path_traversal"
cwe = "CWE-22"
note = "When file path is caller-controlled"
