[tool]
name = "NuGet"
category = "package_manager"
homepage = "https://www.nuget.org"
docs = "https://learn.microsoft.com/en-us/nuget/"
description = ".NET package manager"

[detect]
files = ["*.csproj", "packages.config", "nuget.config", "Directory.Packages.props", "Directory.Build.props"]
ecosystems = ["csharp"]

[commands]
run = "dotnet restore"
alternatives = ["nuget restore"]

[config]
files = ["nuget.config"]
lockfile = "packages.lock.json"

[taxonomy]
role = ["package-manager"]
