[tool]
name = "roxygen2"
category = "docs"
homepage = "https://roxygen2.r-lib.org"
docs = "https://roxygen2.r-lib.org"
repo = "https://github.com/r-lib/roxygen2"
description = "In-source documentation generator for R packages"

[detect]
files = ["man-roxygen/"]
dependencies = ["roxygen2"]
dev_dependencies = ["roxygen2"]
ecosystems = ["r"]
[detect.file_contains]
"DESCRIPTION" = ["RoxygenNote:", "Config/roxygen2/"]

[commands]
run = "Rscript -e 'roxygen2::roxygenise()'"

[config]
files = ["DESCRIPTION"]

[taxonomy]
function = ["documentation"]
